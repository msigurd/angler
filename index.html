<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <title>Angler</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Another angle-guessing game.">
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to play Angler.</noscript>
    <main>
      <p>What's the angle?</p>
      <div class="angle-container">
        <svg id="angle" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="The angle to guess"></svg>
      </div>
      <label>
        Guess between 5° and 355°
        <span id="total-guesses">
          <span id="guesses">0</span>/5
        </span>
        <fieldset id="guess-fieldset" class="group">
          <input autofocus id="guess-input" type="number" min="5" max="355" placeholder="Your guess" />
          <button id="submit-btn" class="outline" type="button">Submit</button>
        </fieldset>
      </label>
      <p hidden id="response-already-guessed" class="response">Already guessed!</p>
      <p hidden id="response-correct" class="response">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        Correct!
      </p>
      <p hidden id="response-incorrect" class="response">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
        The angle is
        <span id="response-incorrect__correct-angle">123</span>°
      </p>
      <p hidden id="response-too-high" class="response">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14m7-7-7 7-7-7" />
        </svg>
        Too high
      </p>
      <p hidden id="response-too-low" class="response">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5m-7 7 7-7 7 7" />
        </svg>
        Too low
      </p>
      <form hidden id="play-again" action="/angler">
        <input type="submit" value="Play again" />
      </form>
    </main>
    <footer>
      <a href="https://github.com/msigurd/angler" target="_blank" rel="noopener noreferrer">
        Source code
      </a>
    </footer>
  </body>
</html>
